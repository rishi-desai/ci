name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dogfood: the local copy of the shared workflow tests this branch's changes before v1 moves.
jobs:
  ci:
    # `$/` (GitHub's self-repository syntax) is preferred, but actionlint 1.7.12 rejects it
    # (rhysd/actionlint#711). Switch once actionlint supports it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
